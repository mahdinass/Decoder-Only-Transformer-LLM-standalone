name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            torch: 'torch==2.10.0'
          - os: ubuntu-latest
            python-version: '3.12'
            torch: 'torch>=2.10,<3'
          - os: windows-latest
            python-version: '3.12'
            torch: 'torch>=2.10,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python scripts/check_distribution.py dist
